<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Azure Site</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f4f6fb;
      color: #1f2937;
      line-height: 1.6;
    }
    header {
      background: #0078d4;
      color: #fff;
      padding: 48px 20px;
      text-align: center;
    }
    header h1 { font-size: 2rem; margin-bottom: 8px; }
    header p { opacity: 0.9; }
    main {
      max-width: 640px;
      margin: -24px auto 40px;
      padding: 0 16px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }
    .card h2 { margin-bottom: 12px; font-size: 1.2rem; }
    .row { display: flex; gap: 8px; }
    input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
    }
    button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #0078d4;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #005fa8; }
    ul { list-style: none; margin-top: 16px; }
    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }
    li.done span { text-decoration: line-through; color: #9ca3af; }
    li span { cursor: pointer; flex: 1; }
    li button { background: #ef4444; padding: 4px 10px; font-size: 0.85rem; }
    li button:hover { background: #dc2626; }
    #time { font-size: 1.6rem; font-weight: 600; color: #0078d4; }
    footer { text-align: center; padding: 20px; color: #6b7280; font-size: 0.9rem; }
  </style>
</head>
<body>

  <header>
    <h1>Hello from Azure 👋</h1>
    <p>My first deployed website</p>
  </header>

  <main>
    <div class="card">
      <h2>Current time</h2>
      <div id="time">--:--:--</div>
    </div>

    <div class="card">
      <h2>My tasks</h2>
      <div class="row">
        <input type="text" id="taskInput" placeholder="Add a task...">
        <button id="addBtn">Add</button>
      </div>
      <ul id="taskList"></ul>
    </div>
  </main>

  <footer>Hosted on Microsoft Azure Static Web Apps</footer>

  <script>
    // Live clock
    const timeEl = document.getElementById("time");
    function tick() { timeEl.textContent = new Date().toLocaleTimeString(); }
    tick();
    setInterval(tick, 1000);

    // Simple task list (saved in the browser)
    const input = document.getElementById("taskInput");
    const list = document.getElementById("taskList");
    let tasks = [];
    try { tasks = JSON.parse(localStorage.getItem("tasks")) || []; } catch (e) {}

    function save() {
      try { localStorage.setItem("tasks", JSON.stringify(tasks)); } catch (e) {}
    }

    function render() {
      list.innerHTML = "";
      tasks.forEach((t, i) => {
        const li = document.createElement("li");
        if (t.done) li.className = "done";

        const span = document.createElement("span");
        span.textContent = t.text;
        span.onclick = () => { tasks[i].done = !tasks[i].done; save(); render(); };

        const del = document.createElement("button");
        del.textContent = "Delete";
        del.onclick = () => { tasks.splice(i, 1); save(); render(); };

        li.append(span, del);
        list.appendChild(li);
      });
    }

    function addTask() {
      const text = input.value.trim();
      if (!text) return;
      tasks.push({ text, done: false });
      input.value = "";
      save();
      render();
    }

    document.getElementById("addBtn").onclick = addTask;
    input.addEventListener("keydown", e => { if (e.key === "Enter") addTask(); });
    render();
  </script>
</body>
</html>
